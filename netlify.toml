[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# Hide the Netlify hostname: send that URL to the public subdomain.
[[redirects]]
  from = "https://pressed-fog.netlify.app"
  to = "https://pressed.sidequestoperations.com"
  status = 301
  force = true

[[redirects]]
  from = "https://pressed-fog.netlify.app/*"
  to = "https://pressed.sidequestoperations.com/:splat"
  status = 301
  force = true
